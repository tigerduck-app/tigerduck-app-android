name: recover-secrets

# TEMPORARY workflow for owner-initiated secret recovery.
# DELETE THIS FILE and the resulting workflow run + artifact after use.
# Requires a one-shot repo secret REVEAL_PASS (passphrase you choose just for this run).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Pack and encrypt every workflow secret
        env:
          REVEAL_PASS: ${{ secrets.REVEAL_PASS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64:             ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD:           ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:                   ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:                ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON:   ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PUSH_SHARED_SECRET:          ${{ secrets.PUSH_SHARED_SECRET }}
          RELEASER_APP_ID:             ${{ secrets.RELEASER_APP_ID }}
          RELEASER_APP_PRIVATE_KEY:    ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE:      ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_PRIVATE_KEY:     ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$REVEAL_PASS" ]; then
            echo "::error::REVEAL_PASS secret is not set. Add it as a repo secret before running."
            exit 1
          fi

          mkdir -p out

          # Each secret goes into its own file so binary/JSON/multiline values
          # survive unchanged. Use printf '%s' to avoid trailing newlines.
          for name in \
            GOOGLE_SERVICES_JSON_BASE64 \
            KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD \
            PLAY_SERVICE_ACCOUNT_JSON \
            PUSH_SHARED_SECRET \
            RELEASER_APP_ID \
            RELEASER_APP_PRIVATE_KEY \
            RELEASE_GPG_PASSPHRASE \
            RELEASE_GPG_PRIVATE_KEY
          do
            printf '%s' "${!name}" > "out/$name"
          done

          tar -cf out.tar -C out .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:REVEAL_PASS \
            -in out.tar -out secrets.enc

          rm -rf out out.tar
          ls -la secrets.enc

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@v4
        with:
          name: secrets-enc
          path: secrets.enc
          retention-days: 1
