name: Release (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}

    steps:
      # The tag is v<versionName> from main's app/build.gradle.kts, so a
      # release can only ever carry the version its code declares. main is
      # pinned to one commit first and that commit is what gets built, so a
      # version bump landing mid-run cannot be built under the older tag.
      - name: Resolve checkout ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          main_sha=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          name=$(gh api -H "Accept: application/vnd.github.raw" "repos/${REPO}/contents/app/build.gradle.kts?ref=${main_sha}" \
            | grep -E '^[[:space:]]*versionName[[:space:]]*=' | head -n1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$name" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts on main (${main_sha})." >&2
            exit 1
          fi
          TAG="v${name}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; will checkout the tag and attach artifacts."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$main_sha" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG not found; will tag main at $main_sha and create the release."
          fi

  # Alongside the build, so a missing secret, an App token that cannot reach
  # the repo, or a GPG key that cannot sign fails in seconds rather than after
  # it. Publish waits for this too, so nothing is published without it.
  preflight:
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Mint Releaser App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      # Imported only to prove it signs; the tag is made in publish.
      - name: Import release GPG key
        if: needs.resolve.outputs.tag_exists == 'false'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      - name: Preflight checks
        run: |
          set -euo pipefail
          fail=0

          # 1. App token reaches the repo.
          if ! gh api "repos/${REPO}" --jq .full_name >/dev/null; then
            echo "::error::App token cannot read ${REPO}. Check RELEASER_APP_ID/RELEASER_APP_PRIVATE_KEY and that the App is installed on this repo." >&2
            fail=1
          fi

          # 2. App token has contents:write (probe by listing branch protection-eligible refs).
          if ! gh api "repos/${REPO}/contents/metadata/org.ntust.app.tigerduck.fdroid.yml?ref=main" --jq .sha >/dev/null; then
            echo "::error::App token cannot read metadata file. App likely missing Contents:read on this repo." >&2
            fail=1
          fi

          # 3. Required artefact secrets present (don't print values; just check non-empty length).
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64; do
            v="${!s:-}"
            if [ -z "$v" ]; then
              echo "::error::Secret $s is empty or missing." >&2
              fail=1
            fi
          done

          # 4. If we're going to tag, verify GPG was imported and email looks GitHub-verifiable.
          if [ "${TAG_EXISTS}" = "false" ]; then
            if [ -z "${TAGGER_KEYID:-}" ]; then
              echo "::error::GPG key not imported (no keyid)." >&2
              fail=1
            fi
            if [ -z "${TAGGER_EMAIL:-}" ]; then
              echo "::error::GPG key has no email UID; GitHub cannot match it to an account." >&2
              fail=1
            fi
            # Sanity-test signing locally so we surface 'no secret key' / 'bad passphrase'
            # before spending 6 minutes building.
            if ! echo test | gpg --batch --yes --local-user "${TAGGER_EMAIL}" --clearsign >/dev/null 2>&1; then
              echo "::error::GPG cannot sign with key for ${TAGGER_EMAIL}. Check RELEASE_GPG_PRIVATE_KEY / RELEASE_GPG_PASSPHRASE." >&2
              fail=1
            fi
            echo "Tagger identity: ${TAGGER_EMAIL} (key ${TAGGER_KEYID})"
            echo "Reminder: this email must be a *verified* email on the GitHub user that owns the matching public key, otherwise the tag will land but show 'Unverified (bad_email)'."
          fi

          if [ "$fail" != "0" ]; then
            exit 1
          fi
          echo "Preflight OK."
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TAG_EXISTS: ${{ needs.resolve.outputs.tag_exists }}
          TAGGER_EMAIL: ${{ steps.gpg.outputs.email }}
          TAGGER_KEYID: ${{ steps.gpg.outputs.keyid }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

  build:
    needs: resolve
    uses: ./.github/workflows/release-build.yaml
    with:
      ref: ${{ needs.resolve.outputs.checkout_ref }}
      upload: true
    secrets: inherit

  publish:
    needs: [resolve, preflight, build]
    runs-on: ubuntu-latest

    steps:
      - name: Mint Releaser App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app_token.outputs.token }}

      - name: Capture build SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Import release GPG key
        if: needs.resolve.outputs.tag_exists == 'false'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true

      # The six files the build's three legs uploaded, side by side in dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check the six files are there
        run: |
          set -euo pipefail
          ls -l dist
          for f in TigerDuck.apk TigerDuck.aab TigerDuck-fdroid.apk TigerDuck-fdroid.aab TigerDuck-Wear.apk TigerDuck-Wear.aab; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing or empty." >&2
              exit 1
            fi
          done

      - name: Create and push signed tag
        if: needs.resolve.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
          REPO: ${{ github.repository }}
          TAGGER_NAME: ${{ steps.gpg.outputs.name }}
          TAGGER_EMAIL: ${{ steps.gpg.outputs.email }}
        run: |
          set -euo pipefail
          # Already there from an earlier attempt of this run: "Re-run failed
          # jobs" re-runs publish, not resolve, whose answer predates the tag.
          # Keep it if it marks this commit, stop if it marks another.
          peeled=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
          plain=$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)
          existing="${peeled:-$plain}"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$SHA" ]; then
              echo "Tag ${TAG} already marks ${SHA}; keeping it."
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${existing}, not on ${SHA}." >&2
            exit 1
          fi
          git config user.name "${TAGGER_NAME}"
          git config user.email "${TAGGER_EMAIL}"
          git tag -s "${TAG}" "${SHA}" -m "${TAG}"
          # Tag refs are outside the ruleset's include list, so this push
          # uses the App token already configured in checkout's credentials.
          git push origin "refs/tags/${TAG}"
          # Verify GitHub recognised the signature.
          state=$(gh api "repos/${REPO}/git/refs/tags/${TAG}" --jq '.object.sha' \
            | xargs -I{} gh api "repos/${REPO}/git/tags/{}" --jq .verification.verified)
          if [ "$state" != "true" ]; then
            tag_obj=$(gh api "repos/${REPO}/git/refs/tags/${TAG}" --jq '.object.sha')
            echo "Tag ${TAG} pushed but NOT verified (state=$state)" >&2
            gh api "repos/${REPO}/git/tags/${tag_obj}" --jq .verification >&2
            exit 1
          fi
          echo "Tag ${TAG} created and verified."

      - name: Update F-Droid metadata commit hash
        if: needs.resolve.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          REPO: ${{ github.repository }}
          BRANCH: main
          TAG: ${{ needs.resolve.outputs.tag }}
          FILE_PATH: metadata/org.ntust.app.tigerduck.fdroid.yml
        run: |
          set -euo pipefail
          # Use the Contents API so GitHub signs the resulting commit with
          # the web-flow key (verified) and the App token's bypass entry on
          # the ruleset lets the push through. Retries on SHA conflict in
          # case another commit landed on ${BRANCH} during the build.
          code=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | head -n1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          for attempt in 1 2 3; do
            current=$(gh api "repos/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}")
            file_sha=$(printf '%s' "$current" | jq -r .sha)
            content=$(printf '%s' "$current" | jq -r .content | base64 -d)
            # A newer version bump may have reached ${BRANCH} during the
            # build. Its metadata must not be pinned to this older commit;
            # that version's own release pins it.
            meta_code=$(printf '%s' "$content" | grep -E '^[[:space:]]*-?[[:space:]]*versionCode:' | head -n1 | sed -E 's/.*versionCode:[[:space:]]*([0-9]+).*/\1/')
            if [ "$meta_code" != "$code" ]; then
              echo "::warning::${FILE_PATH} on ${BRANCH} describes versionCode ${meta_code}, not this release's ${code}; leaving it for that version's release."
              exit 0
            fi
            new_content=$(printf '%s' "$content" | sed -E "s|^([[:space:]]*commit:).*|\1 ${SHA}|")
            if [ "$content" = "$new_content" ]; then
              echo "No change to ${FILE_PATH}; skipping."
              exit 0
            fi
            new_b64=$(printf '%s' "$new_content" | base64 | tr -d '\n')
            if gh api -X PUT "repos/${REPO}/contents/${FILE_PATH}" \
              -f message="chore(fdroid): pin metadata commit to ${SHA} for ${TAG}" \
              -f content="${new_b64}" \
              -f sha="${file_sha}" \
              -f branch="${BRANCH}"; then
              echo "F-Droid metadata commit pushed."
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "Failed to update ${FILE_PATH} after 3 attempts" >&2
              exit 1
            fi
            echo "Update rejected (likely SHA conflict); retrying (attempt $attempt)"
            sleep 2
          done

      # From .github/release-notes-template.md, with the What's New titles
      # filled in. Only for a release that does not exist yet: one that does
      # keeps its notes, which may have been edited by hand.
      - name: Write GitHub Release notes
        id: notes
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; keeping its notes."
            exit 0
          fi
          # The script and template from the commit this run started on: an
          # existing tag checked out above may predate both. The version and
          # What's New still come from the checkout.
          git show "${GITHUB_SHA}:tools/github/release_notes.py" > "$RUNNER_TEMP/release_notes.py"
          git show "${GITHUB_SHA}:.github/release-notes-template.md" > "$RUNNER_TEMP/release-notes-template.md"
          if ! python3 "$RUNNER_TEMP/release_notes.py" --root . \
              --template "$RUNNER_TEMP/release-notes-template.md" \
              --repo "$REPO" --output "$RUNNER_TEMP/release-notes.md"; then
            echo "::warning::Could not write the notes for ${TAG}; the release is published without them. Add them by hand."
            exit 0
          fi
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: TigerDuck Android ${{ needs.resolve.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.apk
            dist/*.aab

      # Last, after the F-Droid pin, so dev gets that back too. The Releaser
      # App's token opens it, so its CI runs; a refusal only warns, since the
      # release is done by now. On every publish that gets here, not only one
      # that tagged: a run that finishes a release an earlier run tagged still
      # owes the pull request, and the script opens none that is not needed.
      # It comes from the commit this run started on, which a checked-out tag
      # may predate. See tools/github/back_merge.py.
      - name: Open the pull request merging main back into dev
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          git show "${GITHUB_SHA}:tools/github/back_merge.py" > "$RUNNER_TEMP/back_merge.py"
          python3 "$RUNNER_TEMP/back_merge.py" --repo "$REPO" --tag "$TAG"
