name: Release (Auto)

# Every commit to main, or a click in the Actions tab.
#
# A version whose tag does not exist yet is released in full: built, sent to
# Play, tagged, and published as a GitHub Release. A commit that does not bump
# the version stops after the first job. A click on a version that is already
# tagged sends it to the ticked Play tracks only, so a release can be widened
# later, e.g. promoted from internal testing to production.
on:
  push:
    branches: [ main ]
    # The F-Droid metadata commit a release pushes to main touches only this
    # file. Ignoring it keeps that commit from starting a run, which would
    # otherwise queue behind the release and could displace a click waiting
    # there (GitHub keeps one pending run per concurrency group).
    paths-ignore:
      - metadata/org.ntust.app.tigerduck.fdroid.yml
  workflow_dispatch:
    inputs:
      phone_internal:
        description: 'Phone → Play internal testing'
        type: boolean
        default: true
      phone_public:
        description: 'Phone → Play production'
        type: boolean
        default: true
      watch_internal:
        description: 'Watch → Play Wear OS internal testing'
        type: boolean
        default: true
      watch_public:
        description: 'Watch → Play Wear OS production'
        type: boolean
        default: true
      rollout:
        description: 'Production rollout, % of users'
        type: choice
        options: [ '10', '20', '50', '100' ]
        default: '10'

permissions:
  contents: write

# One run at a time, on the whole workflow so that `check` decides only after
# the previous release has finished: a commit landing mid-release then finds the
# tag in place instead of releasing the version a second time.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # A push releases to every track; a click releases to the ones ticked.
  PHONE_INTERNAL: ${{ github.event_name == 'push' || inputs.phone_internal }}
  PHONE_PUBLIC: ${{ github.event_name == 'push' || inputs.phone_public }}
  WATCH_INTERNAL: ${{ github.event_name == 'push' || inputs.watch_internal }}
  WATCH_PUBLIC: ${{ github.event_name == 'push' || inputs.watch_public }}
  ROLLOUT_PERCENT: ${{ inputs.rollout || '10' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      # full: new version, release everything. play: tagged version, Play
      # tracks only. skip: nothing to do.
      mode: ${{ steps.version.outputs.mode }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}

    steps:
      - name: Only release main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release (Auto) releases main only; this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}

      - name: Read version and decide what to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          extract_code() { grep -E '^[[:space:]]*versionCode[[:space:]]*=' "$1" | head -n1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/'; }
          extract_name() { grep -E '^[[:space:]]*versionName[[:space:]]*=' "$1" | head -n1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/'; }

          name=$(extract_name app/build.gradle.kts)
          phone_code=$(extract_code app/build.gradle.kts)
          watch_name=$(extract_name wear/build.gradle.kts)
          watch_code=$(extract_code wear/build.gradle.kts)
          tag="v${name}"
          echo "Phone ${name} (${phone_code}), watch ${watch_name} (${watch_code})"
          {
            echo "tag=${tag}"
            echo "phone_code=${phone_code}"
          } >> "$GITHUB_OUTPUT"

          any_target=false
          for t in "$PHONE_INTERNAL" "$PHONE_PUBLIC" "$WATCH_INTERNAL" "$WATCH_PUBLIC"; do
            [ "$t" = "true" ] && any_target=true
          done

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            if [ "$EVENT" = "push" ]; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "::notice::${tag} is already released; nothing to do."
            elif [ "$any_target" = "false" ]; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "::notice::${tag} is already released and no Play track is ticked; nothing to do."
            else
              {
                echo "mode=play"
                echo "ref=refs/tags/${tag}"
              } >> "$GITHUB_OUTPUT"
              echo "::notice::${tag} is already released; sending it to the ticked Play tracks only."
            fi
            exit 0
          fi

          # version-bumped.yaml holds PRs to these; checked again here because
          # a commit can reach main without one, and a mismatch would otherwise
          # surface only at Play, or not at all.
          if [ "$watch_name" != "$name" ]; then
            echo "::error file=wear/build.gradle.kts::watch versionName ${watch_name} does not match the phone's ${name}"
            exit 1
          fi
          # Play keeps every bundle it has been sent and the upload skips one
          # it already has, so a versionCode left unbumped would publish the
          # previous release's binary under the new name. The watch code is
          # tied to the phone's (phone + 10000, see wear/build.gradle.kts), so
          # with that holding, a phone code above the last tag's moves both.
          expected_watch_code=$((phone_code + 10000))
          if [ "$watch_code" != "$expected_watch_code" ]; then
            echo "::error file=wear/build.gradle.kts::watch versionCode ${watch_code} must be the phone's ${phone_code} + 10000 = ${expected_watch_code}"
            exit 1
          fi
          previous=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/||' | sort -V | tail -n1)
          if [ -n "$previous" ]; then
            previous_code=$(gh api -H "Accept: application/vnd.github.raw" \
              "repos/${REPO}/contents/app/build.gradle.kts?ref=${previous}" | { extract_code /dev/stdin; })
            if [ "$phone_code" -le "$previous_code" ]; then
              echo "::error file=app/build.gradle.kts::versionCode ${phone_code} is not above ${previous}'s ${previous_code}; bump it before releasing ${tag}"
              exit 1
            fi
          fi
          {
            echo "mode=full"
            echo "ref=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}."

      # Before the build, so notes over Play's 500-character limit fail in
      # seconds rather than after it. New versions only: this checkout is the
      # commit being released. A tagged version uploads the tag's notes, which
      # the upload step checks before it reaches Play.
      - name: Check Play release notes
        if: steps.version.outputs.mode == 'full'
        run: python3 tools/play/publish.py notes --phone-code "${{ steps.version.outputs.phone_code }}"

  release:
    needs: check
    if: needs.check.outputs.mode != 'skip'
    runs-on: ubuntu-latest

    env:
      TAG: ${{ needs.check.outputs.tag }}
      FULL_RELEASE: ${{ needs.check.outputs.mode == 'full' }}

    steps:
      - name: Mint Releaser App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.check.outputs.ref }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app_token.outputs.token }}
          submodules: true

      # Read from what was checked out: on a tagged version that is the tag,
      # which main may have moved on from.
      - name: Read version
        id: version
        run: |
          set -euo pipefail
          extract_code() { grep -E '^[[:space:]]*versionCode[[:space:]]*=' "$1" | head -n1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/'; }
          extract_name() { grep -E '^[[:space:]]*versionName[[:space:]]*=' "$1" | head -n1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/'; }
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "name=$(extract_name app/build.gradle.kts)"
            echo "phone_code=$(extract_code app/build.gradle.kts)"
            echo "watch_code=$(extract_code wear/build.gradle.kts)"
          } >> "$GITHUB_OUTPUT"

      # On a tagged version the checkout is the tag, which may predate the
      # script or carry an older one. The commit this run started from is in
      # the clone (fetch-depth 0), so take the script from there. The release
      # notes still come from the tag's own whatsnew.json.
      - name: Use this run's Play script
        if: env.FULL_RELEASE != 'true'
        run: |
          mkdir -p tools/play
          git show "${GITHUB_SHA}:tools/play/publish.py" > tools/play/publish.py

      - name: Choose Play targets
        id: targets
        run: |
          targets=()
          [ "$PHONE_INTERNAL" = "true" ] && targets+=(phone:internal)
          [ "$PHONE_PUBLIC" = "true" ] && targets+=(phone:public)
          [ "$WATCH_INTERNAL" = "true" ] && targets+=(watch:internal)
          [ "$WATCH_PUBLIC" = "true" ] && targets+=(watch:public)
          joined=$(IFS=,; echo "${targets[*]}")
          echo "list=${joined}" >> "$GITHUB_OUTPUT"
          echo "Play targets: ${joined:-none}, production rollout ${ROLLOUT_PERCENT}%"

      - name: Import release GPG key
        if: env.FULL_RELEASE == 'true'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Preflight checks
        run: |
          set -euo pipefail
          fail=0

          # 1. Required secrets present (don't print values; just check non-empty length).
          required="KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64"
          if [ -n "${PLAY_TARGETS}" ]; then
            required="${required} PLAY_SERVICE_ACCOUNT_JSON"
          fi
          for s in $required; do
            v="${!s:-}"
            if [ -z "$v" ]; then
              echo "::error::Secret $s is empty or missing." >&2
              fail=1
            fi
          done

          # The rest only matters when this run tags and publishes.
          if [ "${FULL_RELEASE}" = "true" ]; then
            # 2. App token reaches the repo.
            if ! gh api "repos/${REPO}" --jq .full_name >/dev/null; then
              echo "::error::App token cannot read ${REPO}. Check RELEASER_APP_ID/RELEASER_APP_PRIVATE_KEY and that the App is installed on this repo." >&2
              fail=1
            fi

            # 3. App token can read the metadata file it will rewrite.
            if ! gh api "repos/${REPO}/contents/metadata/org.ntust.app.tigerduck.fdroid.yml?ref=main" --jq .sha >/dev/null; then
              echo "::error::App token cannot read metadata file. App likely missing Contents:read on this repo." >&2
              fail=1
            fi

            # 4. GPG imported and its email looks GitHub-verifiable.
            if [ -z "${TAGGER_KEYID:-}" ]; then
              echo "::error::GPG key not imported (no keyid)." >&2
              fail=1
            fi
            if [ -z "${TAGGER_EMAIL:-}" ]; then
              echo "::error::GPG key has no email UID; GitHub cannot match it to an account." >&2
              fail=1
            fi
            # Sanity-test signing locally so we surface 'no secret key' / 'bad passphrase'
            # before spending 6 minutes building.
            if ! echo test | gpg --batch --yes --local-user "${TAGGER_EMAIL}" --clearsign >/dev/null 2>&1; then
              echo "::error::GPG cannot sign with key for ${TAGGER_EMAIL}. Check RELEASE_GPG_PRIVATE_KEY / RELEASE_GPG_PASSPHRASE." >&2
              fail=1
            fi
            echo "Tagger identity: ${TAGGER_EMAIL} (key ${TAGGER_KEYID})"
          fi

          if [ "$fail" != "0" ]; then
            exit 1
          fi
          echo "Preflight OK."
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          PLAY_TARGETS: ${{ steps.targets.outputs.list }}
          TAGGER_EMAIL: ${{ steps.gpg.outputs.email }}
          TAGGER_KEYID: ${{ steps.gpg.outputs.keyid }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      # Both modules resolve `keystore.jks` relative to their own project dir,
      # so the one secret is decoded twice. The watch must be signed with the
      # phone's key: it ships under the same applicationId, and Play rejects a
      # companion signed with anything else.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          cp app/keystore.jks wear/keystore.jks

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/src/play/google-services.json

      # Root-level task names fan out to every module, so this already covers
      # :wear:assembleRelease / :wear:bundleRelease. Everything is built
      # whatever the Play targets: the GitHub Release carries all six files,
      # and on a tagged version Play may not have a bundle yet.
      - name: Build release AAB and APK (phone + watch)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PUSH_SHARED_SECRET: ${{ secrets.PUSH_SHARED_SECRET }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Rename build outputs
        run: |
          mv app/build/outputs/apk/play/release/app-play-release.apk "app/build/outputs/apk/play/release/TigerDuck.apk"
          mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "app/build/outputs/apk/fdroid/release/TigerDuck-fdroid.apk"
          mv app/build/outputs/bundle/playRelease/app-play-release.aab "app/build/outputs/bundle/playRelease/TigerDuck.aab"
          mv app/build/outputs/bundle/fdroidRelease/app-fdroid-release.aab "app/build/outputs/bundle/fdroidRelease/TigerDuck-fdroid.aab"
          # Watch: play-only by construction — :wear has no flavors because it
          # depends on play-services-wearable, so there is no fdroid counterpart
          # to ship. An unsigned build would land as wear-release-unsigned.apk
          # and this mv would fail the job, which is the intended signal.
          mv wear/build/outputs/apk/release/wear-release.apk "wear/build/outputs/apk/release/TigerDuck-Wear.apk"
          mv wear/build/outputs/bundle/release/wear-release.aab "wear/build/outputs/bundle/release/TigerDuck-Wear.aab"

      # Before the tag: if Play fails nothing is tagged, so a new run picks the
      # release up again. The upload skips any bundle Play already has, and
      # the steps after it tolerate their own earlier success, so "Re-run
      # failed jobs" finishes a release that failed part way.
      - name: Upload to Google Play and send for review
        if: steps.targets.outputs.list != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TARGETS: ${{ steps.targets.outputs.list }}
        run: |
          python3 tools/play/publish.py publish \
            --package org.ntust.app.tigerduck \
            --version-name "${{ steps.version.outputs.name }}" \
            --phone-code "${{ steps.version.outputs.phone_code }}" \
            --watch-code "${{ steps.version.outputs.watch_code }}" \
            --phone-aab app/build/outputs/bundle/playRelease/TigerDuck.aab \
            --watch-aab wear/build/outputs/bundle/release/TigerDuck-Wear.aab \
            --targets "${PLAY_TARGETS}" \
            --rollout "$(awk -v p="${ROLLOUT_PERCENT}" 'BEGIN { print p / 100 }')"

      - name: Create and push signed tag
        if: env.FULL_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SHA: ${{ steps.version.outputs.sha }}
          REPO: ${{ github.repository }}
          TAGGER_NAME: ${{ steps.gpg.outputs.name }}
          TAGGER_EMAIL: ${{ steps.gpg.outputs.email }}
        run: |
          set -euo pipefail
          # Already there from an earlier attempt of this run: keep it if it
          # marks this commit, stop if it marks another.
          peeled=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
          plain=$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)
          existing="${peeled:-$plain}"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$SHA" ]; then
              echo "Tag ${TAG} already marks ${SHA}; keeping it."
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${existing}, not on ${SHA}." >&2
            exit 1
          fi
          git config user.name "${TAGGER_NAME}"
          git config user.email "${TAGGER_EMAIL}"
          git tag -s "${TAG}" "${SHA}" -m "${TAG}"
          # Tag refs are outside the ruleset's include list, so this push
          # uses the App token already configured in checkout's credentials.
          git push origin "refs/tags/${TAG}"
          # Verify GitHub recognised the signature.
          state=$(gh api "repos/${REPO}/git/refs/tags/${TAG}" --jq '.object.sha' \
            | xargs -I{} gh api "repos/${REPO}/git/tags/{}" --jq .verification.verified)
          if [ "$state" != "true" ]; then
            tag_obj=$(gh api "repos/${REPO}/git/refs/tags/${TAG}" --jq '.object.sha')
            echo "Tag ${TAG} pushed but NOT verified (state=$state)" >&2
            gh api "repos/${REPO}/git/tags/${tag_obj}" --jq .verification >&2
            exit 1
          fi
          echo "Tag ${TAG} created and verified."

      - name: Update F-Droid metadata commit hash
        if: env.FULL_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SHA: ${{ steps.version.outputs.sha }}
          CODE: ${{ steps.version.outputs.phone_code }}
          REPO: ${{ github.repository }}
          BRANCH: main
          FILE_PATH: metadata/org.ntust.app.tigerduck.fdroid.yml
        run: |
          set -euo pipefail
          # Use the Contents API so GitHub signs the resulting commit with
          # the web-flow key (verified) and the App token's bypass entry on
          # the ruleset lets the push through. Retries on SHA conflict in
          # case another commit landed on ${BRANCH} during the build.
          for attempt in 1 2 3; do
            current=$(gh api "repos/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}")
            file_sha=$(printf '%s' "$current" | jq -r .sha)
            content=$(printf '%s' "$current" | jq -r .content | base64 -d)
            # A newer version bump may have reached ${BRANCH} during the
            # build. Its metadata must not be pinned to this older commit;
            # that version's own release pins it.
            meta_code=$(printf '%s' "$content" | grep -E '^[[:space:]]*-?[[:space:]]*versionCode:' | head -n1 | sed -E 's/.*versionCode:[[:space:]]*([0-9]+).*/\1/')
            if [ "$meta_code" != "$CODE" ]; then
              echo "::warning::${FILE_PATH} on ${BRANCH} describes versionCode ${meta_code}, not this release's ${CODE}; leaving it for that version's release."
              exit 0
            fi
            new_content=$(printf '%s' "$content" | sed -E "s|^([[:space:]]*commit:).*|\1 ${SHA}|")
            if [ "$content" = "$new_content" ]; then
              echo "No change to ${FILE_PATH}; skipping."
              exit 0
            fi
            new_b64=$(printf '%s' "$new_content" | base64 | tr -d '\n')
            if gh api -X PUT "repos/${REPO}/contents/${FILE_PATH}" \
              -f message="chore(fdroid): pin metadata commit to ${SHA} for ${TAG}" \
              -f content="${new_b64}" \
              -f sha="${file_sha}" \
              -f branch="${BRANCH}"; then
              echo "F-Droid metadata commit pushed."
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "Failed to update ${FILE_PATH} after 3 attempts" >&2
              exit 1
            fi
            echo "Update rejected (likely SHA conflict); retrying (attempt $attempt)"
            sleep 2
          done

      - name: Create GitHub Release
        if: env.FULL_RELEASE == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: TigerDuck Android ${{ needs.check.outputs.tag }}
          files: |
            app/build/outputs/apk/play/release/*.apk
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/bundle/fdroidRelease/*.aab
            wear/build/outputs/apk/release/*.apk
            wear/build/outputs/bundle/release/*.aab

      - name: Clean up secrets
        if: always()
        run: |
          rm -f app/keystore.jks
          rm -f wear/keystore.jks
          rm -f app/src/play/google-services.json
