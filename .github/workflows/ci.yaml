name: CI

# Diagnostic only, never merged: runs the play unit tests three times on one
# runner (three JVMs from a cold Robolectric cache, then one JVM and three JVMs
# warm) while sampling memory, swap and the test JVMs, for PR #580.

on:
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Runner
        run: |
          nproc; lscpu | grep -E 'Model name|Thread|Core|Socket|^CPU\(s\)'; free -m; swapon --show || true

      - name: Compile
        run: >-
          ./gradlew -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
          :shared:test :app:compilePlayDebugUnitTestKotlin

      - name: Tests three times
        run: |
          (while true; do
             echo "$(date +%s) mem_used=$(free -m | awk '/Mem:/{print $3}') mem_avail=$(free -m | awk '/Mem:/{print $7}') swap_used=$(free -m | awk '/Swap:/{print $3}') load=$(cut -d' ' -f1 /proc/loadavg) test_jvms=$(ps -eo rss,args | grep 'Gradle Test Executor' | grep -v grep | awk '{n++; s+=$1} END {print n+0 " test_rss_mb=" int(s/1024)}') daemons_rss_mb=$(ps -eo rss,args | grep -E 'GradleDaemon|KotlinCompileDaemon' | grep -v grep | awk '{s+=$1} END {print int(s/1024)}')"
             sleep 2
           done) > "$RUNNER_TEMP/sampler.log" &
          run() {
            echo "== $1 start $(date +%s)"
            rc=0
            ./gradlew -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g \
              -PdiagForks=$2 :app:testPlayDebugUnitTest --rerun -q || rc=$?
            echo "== $1 end $(date +%s) rc=$rc"
          }
          run cold-forks3 3
          ls -la --time-style=+%s ~/.m2/repository/org/robolectric/android-all-instrumented/*/*.jar || true
          run warm-forks1 1
          run warm-forks3 3
          sleep 3
          echo "== sampler"
          cat "$RUNNER_TEMP/sampler.log"
