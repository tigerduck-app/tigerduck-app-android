# Default SDK for Robolectric tests that do not pin their own.
#
# With isIncludeAndroidResources on, Robolectric reads the merged manifest and
# would default to targetSdk (36), whose ApplicationSharedMemory setup fails on
# JDK 21 ("Failed to interact with raw FileDescriptor internals"). Before that
# it had no manifest and fell back to API 23, below minSdk. 33 is the first
# API with POST_NOTIFICATIONS, which the permission tests need.
#
# Every other level a test pins is one more sandbox, a copy of the Android
# framework, held in the same test JVM. So a test pins a level only for what
# depends on it: 30 for below 31 or below 33, 36 for what only API 36 has, and
# 33 where the test needs 33 and must not follow a change of this default.
sdk=33
