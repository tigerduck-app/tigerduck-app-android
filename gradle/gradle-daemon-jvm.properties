# Daemon JVM criteria: require JDK 21, any vendor.
#
# Do NOT re-add `toolchainVendor=JETBRAINS` or the foojay `toolchainUrl.*`
# entries that `./gradlew updateDaemonJvm` writes when run from Android
# Studio (it picks up the bundled JetBrains Runtime). Pinning the vendor to
# JetBrains makes CI — which provisions Temurin 21 via setup-java — fail to
# match any local JDK and fall back to a foojay download of JBR, whose
# redirect ids now return HTTP 400. Version-only matches Temurin (CI) and the
# bundled JBR (local) alike, with no download.
toolchainVersion=21